name: Release

on:
  workflow_run:
    workflows:
      - Python Wheel Build Check
    types:
      - completed

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download build metadata
        uses: actions/download-artifact@v7
        with:
          name: release-metadata
          path: release-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read build metadata
        id: metadata
        shell: bash
        run: |
          ref="$(cat release-metadata/github-ref.txt)"
          sha="$(cat release-metadata/github-sha.txt)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Build ref: $ref"
          echo "Build sha: $sha"

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: artifacts
          merge-multiple: false
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'artifacts/wheels-*/*'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish 'artifacts/wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
